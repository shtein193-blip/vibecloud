<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#09090c">
<meta name="color-scheme" content="dark">
<title>VibeCloud</title>
<link rel="preload" href="fonts/Anton-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2309090c'/%3E%3Cpath d='M7 9l9 15 9-15' fill='none' stroke='%23d6f35b' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="mblur" x="-40%" y="-10%" width="180%" height="120%"><feGaussianBlur stdDeviation="18 0"/></filter>
  </defs>
</svg>

<div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<div id="intro" aria-hidden="true">
  <span class="w w1">Vibe</span>
  <span class="w w2">Cloud</span>
  <span class="bar"></span>
</div>

<main id="app">
  <section class="view" data-view="home" aria-label="Главная"></section>
  <section class="view" data-view="library" aria-label="Медиатека"></section>
  <section class="view" data-view="import" aria-label="Перенос"></section>
  <section class="view" data-view="mixtapes" aria-label="Микстейпы"></section>
</main>

<div id="detail" aria-live="polite"></div>
<div id="mini"></div>
<nav id="nav" aria-label="Навигация"></nav>
<div id="player" role="dialog" aria-label="Плеер"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<audio id="audio" preload="auto" playsinline></audio>

<script src="js/demo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
